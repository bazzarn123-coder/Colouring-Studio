<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Coloring Studio</title>
    <!-- Custom Vector Favicon for Address Bar -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='16' fill='%234f46e5'/><path d='M10 14a2 2 0 1 0 4 0 2 2 0 1 0-4 0m3-5a2 2 0 1 0 4 0 2 2 0 1 0-4 0m7 3a2 2 0 1 0 4 0 2 2 0 1 0-4 0m-4 8c3.87 0 7-2.69 7-6 0-1.25-.5-2.4-1.38-3.32-.23-.24-.6-.24-.84-.01-.24.23-.24.6-.01.84C23.27 10.9 23.5 11.88 23.5 13c0 3.04-2.91 5.5-6.5 5.5s-6.5-2.46-6.5-5.5c0-1.12.23-2.1.63-2.49.24-.23.24-.6 0-.84-.24-.23-.61-.23-.84.01C9.5 10.6 9 11.75 9 13c0 3.31 3.13 6 7 6z' fill='%23ffffff'/></svg>">
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
            box-sizing: border-box;
        }
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            overscroll-behavior: none;
            touch-action: none;
            background-color: #0f172a;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        }
        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }
        .hide-scrollbar {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
        .swatch-btn {
            transition: transform 0.15s ease, box-shadow 0.15s ease;
        }
        .swatch-btn.active {
            transform: scale(1.18);
            box-shadow: 0 0 0 3px #0f172a, 0 0 0 5px #6366f1;
        }
        #canvas-wrapper {
            background-color: #1e293b;
            background-image: radial-gradient(#334155 1.5px, transparent 1.5px);
            background-size: 20px 20px;
        }
        #paint-canvas, #line-canvas {
            touch-action: none;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border-radius: 0.5rem;
        }
        #line-canvas {
            pointer-events: none;
        }
        #canvas-container {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.6);
            will-change: transform;
        }
    </style>
</head>
<body class="flex flex-col h-full w-full text-slate-100">

    <!-- FULL-SIZE SPLASH SCREEN -->
    <div id="splash-screen" class="absolute inset-0 z-50 bg-black flex flex-col justify-between p-4 sm:p-8 transition-opacity duration-700">
        <div class="absolute inset-0 flex items-center justify-center overflow-hidden">
            <img src="Cover.jpg" alt="Splash Cover" class="w-full h-full object-contain">
        </div>
        <div class="relative z-10 w-full max-w-xs mx-auto mb-4 sm:mb-8">
            <button id="btn-enter" class="w-full py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl font-semibold shadow-2xl transition flex items-center justify-center gap-2 border border-indigo-500/50">
                <span>Enter Studio</span>
                <span class="text-lg">🎨</span>
            </button>
        </div>
    </div>

    <!-- GALLERY / HOME SCREEN -->
    <div id="home-screen" class="absolute inset-0 z-30 bg-slate-900 flex flex-col overflow-y-auto">
        <header class="bg-slate-800/90 backdrop-blur border-b border-slate-700 p-4 sm:p-6 sticky top-0 z-10 shadow-lg">
            <div class="max-w-6xl mx-auto flex justify-between items-center">
                <div class="flex items-center gap-3">
                    <span class="text-3xl sm:text-4xl">🎨</span>
                    <div>
                        <h1 class="text-xl sm:text-2xl font-bold tracking-tight text-white">Coloring Studio</h1>
                        <p class="text-xs sm:text-sm text-slate-400">Relaxing adult coloring book with instant save & fill protection</p>
                    </div>
                </div>
            </div>
        </header>

        <main class="flex-1 p-4 sm:p-8 max-w-6xl mx-auto w-full">
            <div class="mb-6 flex flex-col sm:flex-row sm:justify-between sm:items-center gap-4">
                <div>
                    <h2 class="text-lg font-semibold text-slate-200">Select an Illustration</h2>
                    <span id="gallery-counter" class="text-xs text-slate-400 bg-slate-800 px-3 py-1 rounded-full border border-slate-700">Loading library...</span>
                </div>
                
                <!-- Fixed Upload Button Setup -->
                <input type="file" id="image-upload" accept="image/*" class="hidden">
                <label for="image-upload" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg shadow-lg cursor-pointer text-sm font-medium transition flex items-center justify-center gap-2 shrink-0">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-8l-4-4m0 0L8 8m4-4v12"/></svg>
                    Upload Picture
                </label>
            </div>
            
            <div id="gallery-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
                <!-- Gallery items rendered programmatically -->
            </div>
        </main>
    </div>

    <!-- WORKSPACE / COLORING SCREEN -->
    <div id="workspace-screen" class="absolute inset-0 z-10 flex flex-col h-full w-full bg-slate-950 hidden">
        
        <!-- Top Navigation Bar -->
        <header class="bg-slate-900 border-b border-slate-800 px-3 py-2 sm:px-6 sm:py-3 flex justify-between items-center z-20 shrink-0">
            <div class="flex items-center gap-2">
                <button id="btn-back" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 transition flex items-center gap-1.5 text-xs sm:text-sm font-medium">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/></svg>
                    <span>Gallery</span>
                </button>
                <h2 id="artwork-title" class="text-xs sm:text-base font-semibold text-slate-200 truncate max-w-[120px] sm:max-w-xs ml-2">Coloring Studio</h2>
            </div>

            <div class="flex items-center gap-1.5 sm:gap-2">
                <button id="btn-undo" title="Undo Action" class="p-2 rounded-lg bg-slate-800 hover:bg-slate-700 text-slate-200 disabled:opacity-40 disabled:cursor-not-allowed transition">
                    <svg class="w-4 h-4 sm:w-5 sm:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 10h10a8 8 0 018 8v2M3 10l6 6m-6-6l6-6"/></svg>
                </button>
                <button id="btn-clear" title="Reset Canvas" class="px-2.5 py-1.5 rounded-lg bg-red-950/60 hover:bg-red-900/80 text-red-300 border border-red-800/50 text-xs sm:text-sm font-medium transition">
                    Reset
                </button>
                <button id="btn-download" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs sm:text-sm font-medium flex items-center gap-1 shadow-md transition">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"/></svg>
                    <span class="hidden sm:inline">Save PNG</span>
                </button>
            </div>
        </header>

        <!-- Studio Viewport & Bottom Palette Bar Container -->
        <div class="flex-1 flex flex-col relative overflow-hidden">
            
            <!-- Floating Tool / Zoom Navigation Controls (Left side) -->
            <div class="absolute top-4 left-4 z-20 flex flex-col gap-2 bg-slate-900/90 backdrop-blur p-1.5 rounded-xl border border-slate-700 shadow-xl">
                <button id="btn-tool-fill" title="Paint Fill Tool" class="p-2.5 rounded-lg bg-indigo-600 text-white transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19.428 15.428a2 2 0 00-1.022-.547l-2.387-.477a6 6 0 00-3.86.517l-.318.158a6 6 0 01-3.86.517L6.05 15.21a2 2 0 00-1.806.547M8 4h8l-1 1v5.172a2 2 0 00.586 1.414l5 5c1.26 1.26.367 3.414-1.415 3.414H4.828c-1.782 0-2.674-2.154-1.414-3.414l5-5A2 2 0 009 10.172V5L8 4z"/></svg>
                </button>
                <button id="btn-tool-pencil" title="Drawing Pencil Tool" class="p-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"/></svg>
                </button>
                <button id="btn-tool-line" title="Point-to-Point Line Tool" class="p-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 20L20 4M4 4l16 16"/></svg>
                </button>
                <button id="btn-tool-pan" title="Pan / Move Canvas Tool" class="p-2.5 rounded-lg text-slate-400 hover:text-white hover:bg-slate-800 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 11.5V14m0-2.5v-6a1.5 1.5 0 113 0m-3 6a1.5 1.5 0 00-3 0v2a7.5 7.5 0 0015 0v-5a1.5 1.5 0 00-3 0m-6-3V11m0-5.5a1.5 1.5 0 013 0v3m0 0V11m0-5.5a1.5 1.5 0 013 0v3"/></svg>
                </button>
                <div class="w-full h-px bg-slate-700 my-0.5"></div>
                <button id="btn-zoom-in" title="Zoom In" class="p-2 rounded-lg text-slate-300 hover:bg-slate-800 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/></svg>
                </button>
                <button id="btn-zoom-out" title="Zoom Out" class="p-2 rounded-lg text-slate-300 hover:bg-slate-800 transition">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18 12H6"/></svg>
                </button>
                <button id="btn-zoom-reset" title="Reset Zoom" class="p-2 rounded-lg text-slate-300 hover:bg-slate-800 text-xs font-bold transition">
                    1:1
                </button>
            </div>

            <!-- Canvas Viewport -->
            <div id="canvas-wrapper" class="flex-1 relative flex items-center justify-center overflow-hidden p-2 sm:p-4">
                <div id="canvas-container" class="relative w-full max-w-[750px] aspect-square rounded-lg origin-center cursor-crosshair">
                    <canvas id="paint-canvas" width="1000" height="1000" class="bg-white"></canvas>
                    <canvas id="line-canvas" width="1000" height="1000"></canvas>
                </div>
            </div>

            <!-- Color Palette & Controls Bottom Dock (Scrollable) -->
            <div class="bg-slate-900 border-t border-slate-800 w-full p-3 sm:p-4 flex flex-col gap-3 shrink-0 z-20 shadow-2xl max-h-[48vh] overflow-y-auto">
                
                <!-- TOP SECTION: Pencil Size, Custom Color, & Eraser Tools -->
                <div class="flex flex-wrap items-center justify-between gap-3 pb-2 border-b border-slate-800">
                    <!-- Pencil Size Adjuster -->
                    <div class="flex items-center gap-2 bg-slate-800/60 px-3 py-1.5 rounded-xl border border-slate-700/80">
                        <span class="text-xs text-slate-400 font-medium">Size: <span id="pencil-size-label" class="text-indigo-400 font-bold">6px</span></span>
                        <div class="flex items-center gap-1.5">
                            <button type="button" class="size-btn px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700 transition" data-size="3">Fine</button>
                            <button type="button" class="size-btn px-2 py-0.5 rounded bg-indigo-600 text-xs text-white font-medium transition active" data-size="6">Med</button>
                            <button type="button" class="size-btn px-2 py-0.5 rounded bg-slate-800 hover:bg-slate-700 text-xs text-slate-300 border border-slate-700 transition" data-size="14">Bold</button>
                        </div>
                    </div>

                    <!-- Custom Color Picker & Eraser -->
                    <div class="flex items-center gap-2">
                        <label class="flex items-center gap-2 bg-slate-800 hover:bg-slate-700/80 px-3 py-1.5 rounded-xl border border-slate-700 cursor-pointer transition">
                            <div id="custom-color-preview" class="w-5 h-5 rounded-full border border-white/20 shadow-inner bg-indigo-500 shrink-0"></div>
                            <span class="text-xs text-slate-300 font-medium">Custom</span>
                            <input type="color" id="custom-color-picker" value="#6366f1" class="sr-only">
                        </label>

                        <button id="btn-eraser" class="p-2 bg-slate-800 hover:bg-slate-700 rounded-xl border border-slate-700 text-slate-300 hover:text-white transition flex items-center justify-center shrink-0" title="Eraser (White Fill)">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
                        </button>
                    </div>
                </div>

                <!-- MIDDLE SECTION: Palette Selector (Moved ABOVE colors) -->
                <div class="flex items-center justify-between gap-2 w-full pt-1">
                    <span class="text-xs font-semibold uppercase tracking-wider text-slate-400">Palette Theme</span>
                    <select id="palette-select" class="bg-slate-800 text-xs text-slate-200 border border-slate-700 rounded-lg px-2.5 py-1.5 focus:outline-none focus:ring-2 focus:ring-indigo-500">
                        <option value="jewel">Jewel Tones</option>
                        <option value="botanical">Botanical Garden</option>
                        <option value="pastels">Pastel Dream</option>
                        <option value="vivid">Neon Glow</option>
                    </select>
                </div>

                <!-- BOTTOM SECTION: Swatches Grid (Scrollable horizontally) -->
                <div class="w-full">
                    <div id="swatches-grid" class="flex gap-2 overflow-x-auto hide-scrollbar py-1 px-1 items-center max-w-full">
                        <!-- Swatches injected via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const CANVAS_SIZE = 1000;

        // =========================================================================
        // EDITABLE ARTWORK INDEX
        // Add, remove, or adjust your pictures and text here easily using dedicated lines!
        // =========================================================================
        const ARTWORKS = [
            {
                id: 'mandala-lotus',
                title: 'Mandala Lotus',
                description: 'Intricate radial lotus petals with outer geometric rings',
                draw: function(ctx) {
                    try {
                        ctx.save();
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 6;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';

                        const circles = [460, 410, 350, 270, 180, 100, 40];
                        circles.forEach(r => {
                            ctx.beginPath();
                            ctx.arc(500, 500, r, 0, Math.PI * 2);
                            ctx.stroke();
                        });

                        ctx.lineWidth = 4;
                        for (let i = 0; i < 12; i++) {
                            const angle = (i * Math.PI) / 6;
                            ctx.save();
                            ctx.translate(500, 500);
                            ctx.rotate(angle);
                            
                            ctx.beginPath();
                            ctx.moveTo(0, -270);
                            ctx.quadraticCurveTo(-45, -340, 0, -410);
                            ctx.quadraticCurveTo(45, -340, 0, -270);
                            ctx.stroke();

                            ctx.beginPath();
                            ctx.moveTo(0, -100);
                            ctx.quadraticCurveTo(-30, -140, 0, -180);
                            ctx.quadraticCurveTo(30, -140, 0, -100);
                            ctx.stroke();

                            ctx.beginPath();
                            ctx.arc(0, -225, 10, 0, Math.PI * 2);
                            ctx.stroke();

                            ctx.restore();
                        }
                        ctx.restore();
                    } catch(e) {
                        console.error('Error drawing artwork mandala-lotus', e);
                    }
                }
            },
            {
                id: 'solar-lotus',
                title: 'Solar Ray Lotus',
                description: 'Blooming lotus center with radiating solar crown details',
                draw: function(ctx) {
                    try {
                        ctx.save();
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 5;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';

                        ctx.beginPath(); ctx.arc(500, 500, 460, 0, Math.PI * 2); ctx.lineWidth = 8; ctx.stroke(); ctx.lineWidth = 5;
                        ctx.beginPath(); ctx.arc(500, 500, 380, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath(); ctx.arc(500, 500, 240, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath(); ctx.arc(500, 500, 120, 0, Math.PI * 2); ctx.stroke();

                        for(let i=0; i<16; i++) {
                            const angle = (i * Math.PI) / 8;
                            ctx.save();
                            ctx.translate(500, 500);
                            ctx.rotate(angle);
                            ctx.beginPath();
                            ctx.moveTo(0, -120);
                            ctx.bezierCurveTo(-40, -200, 0, -380, 0, -380);
                            ctx.bezierCurveTo(0, -380, 40, -200, 0, -120);
                            ctx.stroke();
                            ctx.restore();
                        }
                        ctx.restore();
                    } catch(e) { console.error(e); }
                }
            },
            {
                id: 'crystal-mandala',
                title: 'Crystal Gem Mandala',
                description: 'Faceted crystal geometry arranged in a symmetrical mandala',
                draw: function(ctx) {
                    try {
                        ctx.save();
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 5;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';

                        ctx.beginPath(); ctx.arc(500, 500, 450, 0, Math.PI * 2); ctx.stroke();
                        for(let i=0; i<8; i++) {
                            const angle = (i * Math.PI) / 4;
                            ctx.save();
                            ctx.translate(500, 500);
                            ctx.rotate(angle);
                            ctx.beginPath();
                            ctx.moveTo(0, 0); ctx.lineTo(0, -450);
                            ctx.moveTo(0, -150); ctx.lineTo(-120, -280); ctx.lineTo(0, -410); ctx.lineTo(120, -280); ctx.closePath();
                            ctx.stroke();
                            ctx.restore();
                        }
                        ctx.restore();
                    } catch(e) { console.error(e); }
                }
            },
            {
                id: 'stellar-mandala',
                title: 'Stellar Starburst',
                description: 'Intricate intersecting star polygons and delicate lacework',
                draw: function(ctx) {
                    try {
                        ctx.save();
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 4;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';

                        ctx.beginPath(); ctx.arc(500, 500, 460, 0, Math.PI * 2); ctx.lineWidth = 8; ctx.stroke(); ctx.lineWidth = 4;
                        
                        for(let i=0; i<10; i++) {
                            const angle = (i * Math.PI * 2) / 10;
                            ctx.save();
                            ctx.translate(500, 500);
                            ctx.rotate(angle);
                            ctx.beginPath();
                            ctx.moveTo(0, 0);
                            ctx.lineTo(0, -420);
                            ctx.lineTo(60, -320);
                            ctx.closePath();
                            ctx.stroke();
                            ctx.restore();
                        }
                        ctx.beginPath(); ctx.arc(500, 500, 200, 0, Math.PI * 2); ctx.stroke();
                        ctx.beginPath(); ctx.arc(500, 500, 80, 0, Math.PI * 2); ctx.stroke();
                        ctx.restore();
                    } catch(e) { console.error(e); }
                }
            },
            {
                id: 'geometric-blossom',
                title: 'Geometric Blossom',
                description: 'Harmonic intersecting sacred geometry flower pattern',
                draw: function(ctx) {
                    try {
                        ctx.save();
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 5;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';

                        ctx.beginPath(); ctx.arc(500, 500, 450, 0, Math.PI * 2); ctx.lineWidth = 8; ctx.stroke(); ctx.lineWidth = 5;
                        for(let i=0; i<6; i++) {
                            const angle = (i * Math.PI) / 3;
                            ctx.save();
                            ctx.translate(500, 500);
                            ctx.rotate(angle);
                            ctx.beginPath();
                            ctx.arc(0, -220, 220, 0, Math.PI * 2);
                            ctx.stroke();
                            ctx.restore();
                        }
                        ctx.beginPath(); ctx.arc(500, 500, 100, 0, Math.PI * 2); ctx.stroke();
                        ctx.restore();
                    } catch(e) { console.error(e); }
                }
            },
            {
                id: 'lotus-bloom',
                title: 'Lotus Blossom Mandala',
                description: 'Multi-layered lotus petals radiating outwards in harmony',
                draw: function(ctx) {
                    try {
                        ctx.save();
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 5;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        ctx.beginPath(); ctx.arc(500, 500, 460, 0, Math.PI * 2); ctx.lineWidth = 8; ctx.stroke(); ctx.lineWidth = 5;
                        ctx.beginPath(); ctx.arc(500, 500, 390, 0, Math.PI * 2); ctx.stroke();
                        for(let i=0; i<12; i++) {
                            const angle = (i * Math.PI) / 6;
                            ctx.save();
                            ctx.translate(500, 500);
                            ctx.rotate(angle);
                            ctx.beginPath();
                            ctx.moveTo(0, -100);
                            ctx.bezierCurveTo(-50, -220, 0, -390, 0, -390);
                            ctx.bezierCurveTo(0, -390, 50, -220, 0, -100);
                            ctx.stroke();
                            ctx.restore();
                        }
                        ctx.beginPath(); ctx.arc(500, 500, 100, 0, Math.PI * 2); ctx.stroke();
                        ctx.restore();
                    } catch(e) { console.error(e); }
                }
            },
            {
                id: 'infinite-lace',
                title: 'Infinite Lace Mandala',
                description: 'Delicate concentric lace rings and woven geometric threads',
                draw: function(ctx) {
                    try {
                        ctx.save();
                        ctx.strokeStyle = '#000000';
                        ctx.lineWidth = 4;
                        ctx.lineCap = 'round';
                        ctx.lineJoin = 'round';
                        ctx.beginPath(); ctx.arc(500, 500, 460, 0, Math.PI * 2); ctx.lineWidth = 8; ctx.stroke(); ctx.lineWidth = 4;
                        for(let r=400; r>=100; r-=75) {
                            ctx.beginPath(); ctx.arc(500, 500, r, 0, Math.PI * 2); ctx.stroke();
                        }
                        for(let i=0; i<24; i++) {
                            const angle = (i * Math.PI) / 12;
                            ctx.save();
                            ctx.translate(500, 500);

            if (!nums || nums.length < 3) return rgb;

        function hexToRgba(hex) {
            let h = hex.replace('#', '');
            if (h.length === 3) h = h.split('').map(c => c + c).join('');
            const num = parseInt(h, 16);
            return [(num >> 16) & 255, (num >> 8) & 255, num & 255, 255];
        }

        function executeFloodFill(startX, startY, fillHex) {
            if (isProcessing) return;
            isProcessing = true;

            requestAnimationFrame(() => {
                try {
                    if (startX < 0 || startX >= CANVAS_SIZE || startY < 0 || startY >= CANVAS_SIZE) {
                        isProcessing = false;
                        return;
                    }

                    const paintImgData = paintCtx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                    const lineImgData = lineCtx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE);

                    const paintBytes = paintImgData.data;
                    const lineBytes = lineImgData.data;

                    const [fr, fg, fb, fa] = hexToRgba(fillHex);
                    const startIdx = (startY * CANVAS_SIZE + startX) * 4;

                    const tr = paintBytes[startIdx];
                    const tg = paintBytes[startIdx + 1];
                    const tb = paintBytes[startIdx + 2];
                    const ta = paintBytes[startIdx + 3];

                    const isWall = (idx) => {
                        const alpha = lineBytes[idx + 3];
                        if (alpha < 50) return false;
                        const r = lineBytes[idx];
                        const g = lineBytes[idx + 1];
                        const b = lineBytes[idx + 2];
                        return (0.299 * r + 0.587 * g + 0.114 * b) < 120;
                    };

                    if (isWall(startIdx) || (tr === fr && tg === fg && tb === fb && ta === fa)) {
                        isProcessing = false;
                        return;
                    }

                    pushUndo();

                    const matchesTarget = (idx) => {
                        return paintBytes[idx] === tr &&
                               paintBytes[idx + 1] === tg &&
                               paintBytes[idx + 2] === tb &&
                               paintBytes[idx + 3] === ta;
                    };

                    const setFillColor = (idx) => {
                        paintBytes[idx] = fr;
                        paintBytes[idx + 1] = fg;
                        paintBytes[idx + 2] = fb;
                        paintBytes[idx + 3] = fa;
                    };

                    const stack = [[startX, startX, startY, 1], [startX, startX, startY - 1, -1]];
                    setFillColor(startIdx);

                    let ops = 0;
                    const maxOps = 120000;
                    const startTime = performance.now();

                    while (stack.length > 0) {
                        ops++;
                        if (ops > maxOps || (ops % 1000 === 0 && performance.now() - startTime > 50)) break;

                        const [x1, x2, y, dy] = stack.pop();
                        let x = x1;

                        if (y < 0 || y >= CANVAS_SIZE) continue;

                        while (x > 0) {
                            const idx = (y * CANVAS_SIZE + (x - 1)) * 4;
                            if (!matchesTarget(idx) || isWall(idx)) break;
                            setFillColor(idx);
                            x--;
                        }

                        let spanStart = x;
                        if (spanStart < x1) stack.push([spanStart, x1 - 1, y - dy, -dy]);

                        x = x1;
                        while (x <= x2) {
                            while (x < CANVAS_SIZE) {
                                const idx = (y * CANVAS_SIZE + x) * 4;
                                if (!matchesTarget(idx) || isWall(idx)) break;
                                setFillColor(idx);
                                x++;
                            }

                            if (x > spanStart) stack.push([spanStart, x - 1, y + dy, dy]);
                            if (x - 1 > x2) stack.push([x2 + 1, x - 1, y - dy, -dy]);

                            x++;
                            while (x <= x2) {
                                const idx = (y * CANVAS_SIZE + x) * 4;
                                if (matchesTarget(idx) && !isWall(idx)) break;
                                x++;
                            }
                            spanStart = x;
                        }
                    }

                    paintCtx.putImageData(paintImgData, 0, 0);
                    saveProgress();

                    if (window.navigator && window.navigator.vibrate) {
                        window.navigator.vibrate(12);
                    }
                } catch(e) {
                    console.error('Error filling', e);
                } finally {
                    isProcessing = false;
                }
            });
        }

        function getCanvasPoint(clientX, clientY) {
            const rect = paintCanvas.getBoundingClientRect();
            const scaleX = CANVAS_SIZE / rect.width;
            const scaleY = CANVAS_SIZE / rect.height;

            const x = Math.round((clientX - rect.left) * scaleX);
            const y = Math.round((clientY - rect.top) * scaleY);
            return { x, y };
        }

        }

        canvasContainer.addEventListener('pointerdown', (e) => {
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (activePointers.size === 2) {
                isDrawing = false;
                const pts = Array.from(activePointers.values());
                initialPinchDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                initialScale = scale;
                return;
            }

            if (activePointers.size === 1) {
                pointerStartX = e.clientX - panX;
                pointerStartY = e.clientY - panY;
                initialPanX = panX;
                initialPanY = panY;

                if (currentTool === 'pencil') {
                    isDrawing = true;
                    pushUndo();
                    const pt = getCanvasPoint(e.clientX, e.clientY);
                    lastX = pt.x;
                    lastY = pt.y;

                    paintCtx.save();
                    paintCtx.fillStyle = currentColor;
                    paintCtx.beginPath();
                    paintCtx.arc(lastX, lastY, pencilSize / 2, 0, Math.PI * 2);
                    paintCtx.fill();
                    paintCtx.restore();
                } else if (currentTool === 'line') {
                    const pt = getCanvasPoint(e.clientX, e.clientY);
                    if (!lineStartPoint) {
                        pushUndo();
                        lineStartPoint = pt;
                        lineSnapshot = lineCtx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                    } else {
                        if (lineSnapshot) lineCtx.putImageData(lineSnapshot, 0, 0);

                        paintCtx.save();
                        paintCtx.strokeStyle = currentColor;
                        paintCtx.lineWidth = pencilSize;
                        paintCtx.lineCap = 'round';
                        paintCtx.lineJoin = 'round';
                        paintCtx.beginPath();
                        paintCtx.moveTo(lineStartPoint.x, lineStartPoint.y);
                        paintCtx.lineTo(pt.x, pt.y);
                        paintCtx.stroke();
                        paintCtx.restore();

                        saveProgress();
                        lineStartPoint = pt;
                        lineSnapshot = lineCtx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                    }
                }
            }
        });

        window.addEventListener('pointermove', (e) => {
            if (!activePointers.has(e.pointerId)) return;
            activePointers.set(e.pointerId, { x: e.clientX, y: e.clientY });

            if (activePointers.size === 2) {
                const pts = Array.from(activePointers.values());
                const currentDist = Math.hypot(pts[0].x - pts[1].x, pts[0].y - pts[1].y);
                if (initialPinchDist > 0) {
                    const factor = currentDist / initialPinchDist;
                    scale = Math.min(Math.max(1, initialScale * factor), 5);
                    if (scale === 1) { panX = 0; panY = 0; }
                    applyCanvasTransform();
                }
                return;
            }

            if (activePointers.size === 1) {
                if (currentTool === 'pencil' && isDrawing) {
                    const pt = getCanvasPoint(e.clientX, e.clientY);
                    paintCtx.save();
                    paintCtx.strokeStyle = currentColor;
                    paintCtx.lineWidth = pencilSize;
                    paintCtx.lineCap = 'round';
                    paintCtx.lineJoin = 'round';
                    paintCtx.beginPath();
                    paintCtx.moveTo(lastX, lastY);
                    paintCtx.lineTo(pt.x, pt.y);
                    paintCtx.stroke();
                    paintCtx.restore();
                    lastX = pt.x;
                    lastY = pt.y;
                } else if (currentTool === 'line' && lineStartPoint) {
                    const pt = getCanvasPoint(e.clientX, e.clientY);
                    if (lineSnapshot) lineCtx.putImageData(lineSnapshot, 0, 0);
                    lineCtx.save();
                    lineCtx.strokeStyle = currentColor;
                    lineCtx.lineWidth = pencilSize;
                    lineCtx.lineCap = 'round';
                    lineCtx.lineJoin = 'round';
                    lineCtx.beginPath();
                    lineCtx.moveTo(lineStartPoint.x, lineStartPoint.y);
                    lineCtx.lineTo(pt.x, pt.y);
                    lineCtx.stroke();
                    lineCtx.restore();
                } else if (currentTool === 'pan' || scale > 1) {
                    panX = e.clientX - pointerStartX;
                    panY = e.clientY - pointerStartY;
                    applyCanvasTransform();
                }
            }
        });

        window.addEventListener('pointerup', (e) => {
            const wasTwoPointers = activePointers.size === 2;
            activePointers.delete(e.pointerId);

            if (wasTwoPointers) return;

            if (currentTool === 'pencil' && isDrawing) {
                isDrawing = false;
                saveProgress();
                return;
            }

            const now = performance.now();
            if (now - lastTapTime < 150) return;
            lastTapTime = now;

            const distMoved = Math.hypot(panX - initialPanX, panY - initialPanY);
            
            if (currentTool === 'fill' && distMoved < 6 && activePointers.size === 0) {
                if (canvasContainer.contains(e.target) || paintCanvas.contains(e.target) || lineCanvas.contains(e.target)) {
                    const pt = getCanvasPoint(e.clientX, e.clientY);
                    executeFloodFill(pt.x, pt.y, currentColor);
                }
            }
        });

        window.addEventListener('pointercancel', (e) => {
            activePointers.delete(e.pointerId);
            isDrawing = false;
        });

        canvasContainer.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (currentTool === 'line') {
                lineStartPoint = null;
                if (lineSnapshot) {
                    lineCtx.putImageData(lineSnapshot, 0, 0);
                    lineSnapshot = null;
                }
            }
        });

        viewport.addEventListener('wheel', (e) => {
            e.preventDefault();
            const factor = e.deltaY < 0 ? 1.15 : 0.85;
            scale = Math.min(Math.max(1, scale * factor), 5);
            if (scale === 1) { panX = 0; panY = 0; }
            applyCanvasTransform();
        }, { passive: false });

        imageUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            const reader = new FileReader();
            reader.onload = function(event) {
                const img = new Image();
                img.onload = function() {
                    const offCanvas = document.createElement('canvas');
                    offCanvas.width = CANVAS_SIZE;
                    offCanvas.height = CANVAS_SIZE;
                    const ctx = offCanvas.getContext('2d', { willReadFrequently: true });
                    
                    const scale = Math.min(CANVAS_SIZE / img.width, CANVAS_SIZE / img.height);
                    const w = img.width * scale;
                    const h = img.height * scale;
                    const x = (CANVAS_SIZE - w) / 2;
                    const y = (CANVAS_SIZE - h) / 2;
                    
                    ctx.drawImage(img, x, y, w, h);
                    
                    const imgData = ctx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                    const data = imgData.data;
                    for (let i = 0; i < data.length; i += 4) {
                        const r = data[i];
                        const g = data[i+1];
                        const b = data[i+2];
                        const alpha = data[i+3];
                        
                        if (alpha < 50) {
                            data[i+3] = 0;
                            continue;
                        }

                        const luminance = 0.299 * r + 0.587 * g + 0.114 * b;
                        if (luminance > 160) {
                            data[i+3] = 0;
                        } else {
                            data[i] = 0; data[i+1] = 0; data[i+2] = 0; data[i+3] = 255;
                        }
                    }
                    ctx.putImageData(imgData, 0, 0);
                    
                    const newArt = {
                        id: 'custom-' + Date.now(),
                        title: 'Custom Upload',
                        description: file.name || 'Your uploaded line art',
                        isCustom: true,
                        lineArtDataUrl: offCanvas.toDataURL('image/png')
                    };
                    
                    customArtworks.unshift(newArt);
                    if (customArtworks.length > 6) {
                        const removed = customArtworks.pop();
                        localStorage.removeItem(`coloring_studio_save_${removed.id}`);
                    }
                    
                    safeSetStorage('coloring_studio_custom_arts', JSON.stringify(customArtworks));
                    imageUpload.value = '';
                    buildGallery();
                    launchStudio(newArt);
                };
                img.src = event.target.result;
            };
            reader.readAsDataURL(file);
        });

        paletteSelect.addEventListener('change', (e) => populatePalette(e.target.value));
        customColorPicker.addEventListener('input', (e) => selectColor(e.target.value));
        btnEraser.addEventListener('click', () => selectColor('#ffffff'));

        btnFill.onclick = () => setToolMode('fill');
        btnPencil.onclick = () => setToolMode('pencil');
        btnLine.onclick = () => setToolMode('line');
        btnPan.onclick = () => setToolMode('pan');

        sizeBtns.forEach(btn => {
            btn.onclick = (e) => {
                e.stopPropagation();
                setPencilSize(btn.getAttribute('data-size'));
            };
        });

        btnZoomIn.onclick = () => { scale = Math.min(5, scale * 1.25); applyCanvasTransform(); };
        btnZoomOut.onclick = () => { scale = Math.max(1, scale / 1.25); if (scale === 1) { panX = 0; panY = 0; } applyCanvasTransform(); };
        btnZoomReset.onclick = resetZoomPan;

        btnUndo.onclick = undo;

        btnClear.onclick = () => {
            try {
                if (!currentArtwork) return;
                isProcessing = false;
                paintCtx.fillStyle = '#ffffff';
                paintCtx.fillRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                localStorage.removeItem(`coloring_studio_save_${currentArtwork.id}`);
                undoStack = [];
                updateUndoUI();
                lineStartPoint = null;
                lineSnapshot = null;
                lineCtx.clearRect(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                if (currentArtwork.isCustom) {
                    const img = new Image();
                    img.onload = () => {
                        lineCtx.drawImage(img, 0, 0, CANVAS_SIZE, CANVAS_SIZE);
                        lineSnapshot = lineCtx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                    };
                    img.src = currentArtwork.lineArtDataUrl;
                } else {
                    currentArtwork.draw(lineCtx);
                    lineSnapshot = lineCtx.getImageData(0, 0, CANVAS_SIZE, CANVAS_SIZE);
                }
            } catch(e) {
                console.error('Error resetting canvas:', e);
            }
        };

        btnDownload.onclick = () => {
            try {
                if (!currentArtwork) return;
                const exportCanvas = document.createElement('canvas');
                exportCanvas.width = CANVAS_SIZE;
                exportCanvas.height = CANVAS_SIZE;
                const eCtx = exportCanvas.getContext('2d');
                eCtx.drawImage(paintCanvas, 0, 0);
                eCtx.drawImage(lineCtx, 0, 0);

                const a = document.createElement('a');
                a.download = `${currentArtwork.id}-colored.png`;
                a.href = exportCanvas.toDataURL('image/png');
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
            } catch(e) {
                console.error('Error downloading image:', e);
            }
        };

        btnBack.onclick = () => {
            try {
                saveProgress();
                workspaceScreen.classList.add('hidden');
                homeScreen.classList.remove('hidden');
                buildGallery();
            } catch(e) {}
        };

        try {
            buildGallery();
            populatePalette('jewel');
        } catch(e) {}
    </script>
</body>
</html>
